<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Mystical Gaming Room Tour</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#09060d;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;color:#fff}#view{position:fixed;inset:0;overflow:hidden;touch-action:none}#room{position:absolute;height:100%;width:auto;max-width:none;left:50%;top:50%;transform:translate(-50%,-50%) scale(1.18);transform-origin:center;user-select:none;-webkit-user-drag:none}.top{position:fixed;top:max(14px,env(safe-area-inset-top));left:14px;right:14px;display:flex;justify-content:space-between;gap:8px;z-index:5}.badge{background:rgba(8,5,13,.72);backdrop-filter:blur(12px);padding:10px 12px;border:1px solid rgba(255,130,220,.35);border-radius:16px;font-weight:700;font-size:13px}.controls{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:8px;z-index:5}button{border:1px solid rgba(255,255,255,.25);background:rgba(8,5,13,.78);color:#fff;border-radius:999px;padding:12px 15px;font-size:15px;backdrop-filter:blur(12px)}.hint{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(8,5,13,.72);padding:12px 16px;border-radius:14px;pointer-events:none;animation:fade 3s forwards}@keyframes fade{0%,65%{opacity:1}100%{opacity:0}}</style></head><body><div id="view"><img id="room" src="https://raw.githubusercontent.com/GCreative850/auto/main/room.jpg" alt="Mystical gaming room"></div><div class="top"><div class="badge">Mystical Gaming Room Tour</div><div class="badge">Drag • Pinch • Zoom</div></div><div class="hint">Drag to look around</div><div class="controls"><button id="left">◀</button><button id="reset">Reset</button><button id="right">▶</button><button id="full">Fullscreen</button></div><script>const img=document.getElementById('room'),view=document.getElementById('view');let x=0,y=0,s=1.18,drag=false,lx=0,ly=0,dist=0;function draw(){img.style.transform=`translate(calc(-50% + ${x}px),calc(-50% + ${y}px)) scale(${s})`}function clamp(){s=Math.max(1,Math.min(2.6,s));x=Math.max(-650,Math.min(650,x));y=Math.max(-450,Math.min(450,y))}view.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;view.setPointerCapture(e.pointerId)});view.addEventListener('pointermove',e=>{if(!drag)return;x+=e.clientX-lx;y+=e.clientY-ly;lx=e.clientX;ly=e.clientY;clamp();draw()});view.addEventListener('pointerup',()=>drag=false);view.addEventListener('wheel',e=>{e.preventDefault();s*=e.deltaY<0?1.08:.92;clamp();draw()},{passive:false});view.addEventListener('touchstart',e=>{const t=[...e.touches];if(t.length===2)dist=Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)},{passive:false});view.addEventListener('touchmove',e=>{e.preventDefault();const t=[...e.touches];if(t.length===2){const d=Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);s*=d/dist;dist=d;clamp();draw()}},{passive:false});left.onclick=()=>{x+=140;clamp();draw()};right.onclick=()=>{x-=140;clamp();draw()};reset.onclick=()=>{x=0;y=0;s=1.18;draw()};full.onclick=()=>document.documentElement.requestFullscreen?.();draw();</script></body></html>
